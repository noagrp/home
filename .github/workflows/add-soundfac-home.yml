name: Add SoundFac to Home
on:
  push:
    paths:
      - '.github/workflows/add-soundfac-home.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add SoundFac app card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          anchor="{type:'app',name:'Audio2Sheet',icon:'🎼',description:'Sing, hum or whistle a melody and turn it into note, beat and pitch data that can be opened directly in Mini Studio for arranging.',url:'https://noagrp.github.io/audio2sheet/'},"
          new=anchor+"\n{type:'app',name:'SoundFac',icon:'🔊',description:'Design and generate sound effects in your browser. Start with presets or paste your own JSON recipe and adjust generic sound controls to create custom effects.',url:'https://noagrp.github.io/soundfac/'},"
          if "name:'SoundFac'" in s:
              raise SystemExit('SoundFac already exists')
          if anchor not in s:
              raise SystemExit('Audio2Sheet anchor not found')
          s=s.replace(anchor,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "noagrp"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add SoundFac to Apps" || exit 0
          git push
